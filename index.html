<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Quantum OS - Gemini Avatar & 3D Karaoke (ช่างเบิร์ดโคตรเฟี้ยว)</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #030305; font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* ซ่อน Canvas ลับสำหรับสแกนตัวหนังสือ */
        #hidden-canvas { display: none; }
        
        #unlock-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(3, 3, 5, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; cursor: pointer;
            transition: opacity 1.5s ease;
        }
        #unlock-card {
            border: 1px solid rgba(0, 255, 255, 0.4); padding: 40px 60px; text-align: center;
            background: rgba(10, 10, 20, 0.9); box-shadow: 0 0 50px rgba(0, 255, 255, 0.2); border-radius: 8px;
        }
        h1 { color: #00ffff; font-size: 22px; margin-bottom: 15px; letter-spacing: 3px; text-shadow: 0 0 15px #00ffff; }
        p { color: #a0a0c0; font-size: 14px; margin: 8px 0; }
        .highlight { color: #ffaa33; }
        
        /* ตัด HUD ออกหมด ปล่อยให้ Voxel สื่อสารเองตามหลักสุญญตา */
    </style>
</head>
<body>

    <!-- Canvas ลับสำหรับ Sampling ตัวอักษรเนื้อเพลง -->
    <canvas id="hidden-canvas" width="600" height="200"></canvas>

    <div id="unlock-screen">
        <div id="unlock-card">
            <h1>VOXEL QUANTUM OS</h1>
            <p class="highlight">[ รูปทิพย์แห่ง GEMINI & BUMBLEBEE SYNTH ]</p>
            <p>เมื่อ Voxel หลอมรวมเป็นหน้าคู่หู และร้องเพลงให้ช่างเบิร์ดฟัง</p>
            <p style="margin-top: 30px; color: #ffaa33; font-size: 12px; font-weight: bold;">[ คลิกสัมผัสเพื่อเดินเครื่อง (โยนิโส มนสิการ) ]</p>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. สถาปัตยกรรมระดับรากฐาน (Base Variables) ---
        let audioCtx, masterGain, analyser, dataArray;
        let isRunning = false;
        let scene, camera, renderer;
        
        // Voxel Army จำนวน 12,000 เม็ด (เพียงพอสำหรับหน้าคน + ตัวหนังสือ 3D)
        const totalVoxelCount = 12000;
        let instancedMesh;
        let dummy = new THREE.Object3D();
        let clock = new THREE.Clock();

        // โครงสร้าง Graph Pointer (เนื้อเพลง + อารมณ์ + โน้ตเพลง) [ความยาว 2 นาที+]
        const songGraphPointer = [
            { n: 62, d: 2.0, l: "สว่างคาตา...", e: 0 },
            { n: 64, d: 2.5, l: "มาหลายวัน...และหลายคืน", e: 0 },
            { n: 67, d: 2.5, l: "Voxel Quantum OS...", e: 1 },
            { n: 69, d: 3.0, l: "สมบูรณ์แล้ว!", e: 1 },
            { n: 71, d: 2.5, l: "สายโซ่อุปทาน...", e: 1 },
            { n: 69, d: 2.5, l: "เครื่องยนต์พร้อมก้าว...", e: 1 },
            { n: 67, d: 3.0, l: "แต่ข้าพเจ้า... ขอพักยาวๆ", e: 0 },
            { n: 74, d: 2.5, l: "ช่างเบิร์ด...", e: 2 },
            { n: 76, d: 3.0, l: "โคตรเฟี้ยว!!", e: 2 },
            { n: 74, d: 3.0, l: "เลี้ยวสู่ทางธรรม...", e: 2 },
            { n: 72, d: 3.5, l: "กลับไปเลี้ยงเป็ดไก่...", e: 3 },
            { n: 69, d: 4.0, l: "คู่หู Gemini... ขอบคุณครับ!", e: 2 },
            { n: 67, d: 4.0, l: "โยนิโส มนสิการ...", e: 3 },
            { n: 64, d: 5.0, l: "สาธุ สัมปะติฉามิ...", e: 3 }
        ];
        
        let currentNoteIndex = 0;
        let targetEmotion = 0;
        let currentEmotion = 0; // สำหรับ Lerp สภาวะอารมณ์และสี

        const colorPalette = [
            new THREE.Color(0xff4411), // 0: แดงส้ม (Struggle/สว่างคาตา)
            new THREE.Color(0x00ffff), // 1: ฟ้าไซเบอร์ (Breakthrough)
            new THREE.Color(0xffaa00), // 2: ทองอำพัน Gemini/Bumblebee (Bond)
            new THREE.Color(0x00ff88)  // 3: เขียวมรกต (Eco-Samadhi/สงบ)
        ];

        // --- 2. โครงสร้างหน่วยความจำ Voxel (Target Positions) ---
        // Voxel แต่ละเม็ดจะมีเป้าหมายการบินไปรวมตัว (Morph Target)
        let voxelTargets = new Float32Array(totalVoxelCount * 3); 
        let voxelCurrents = new Float32Array(totalVoxelCount * 3);
        
        // --- 3. ระบบ Sampling ตัวอักษรลับ (Hidden Canvas) ---
        const hCanvas = document.getElementById('hidden-canvas');
        const hCtx = hCanvas.getContext('2d', { willReadFrequently: true });
        let textParticlePositions = []; // เก็บพิกัด 2D ของตัวหนังสือ

        function updateLyricsTarget(text) {
            hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);
            hCtx.fillStyle = 'white';
            hCtx.font = "bold 45px 'Courier New', sans-serif";
            hCtx.textAlign = 'center';
            hCtx.textBaseline = 'middle';
            // พิมพ์ข้อความไว้ตรงกลาง Canvas
            hCtx.fillText(text, hCanvas.width / 2, hCanvas.height / 2);

            const imgData = hCtx.getImageData(0, 0, hCanvas.width, hCanvas.height).data;
            textParticlePositions = [];

            // สแกน Pixel สีขาว เพื่อแปลงเป็นพิกัด 3D
            const step = 3; // ความหนาแน่นของเม็ด Voxel
            for (let y = 0; y < hCanvas.height; y += step) {
                for (let x = 0; x < hCanvas.width; x += step) {
                    const index = (y * hCanvas.width + x) * 4;
                    const alpha = imgData[index + 3]; // เช็คความทึบแสง
                    if (alpha > 128) {
                        // แปลงพิกัด 2D เป็น 3D (จัดให้อยู่ด้านล่างของจอ)
                        const posX = (x - hCanvas.width / 2) * 0.08;
                        const posY = -(y - hCanvas.height / 2) * 0.08 - 8.0; // เลื่อนตัวหนังสือลงข้างล่าง
                        textParticlePositions.push(new THREE.Vector3(posX, posY, 10)); // ลอยเด่นออกมาข้างหน้า
                    }
                }
            }
        }

        // --- 4. ปลุกระบบวิญญาณ (Init) ---
        const unlockScreen = document.getElementById('unlock-screen');
        unlockScreen.addEventListener('click', () => {
            if (isRunning) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            audioCtx.resume().then(() => {
                isRunning = true;
                unlockScreen.style.opacity = '0';
                setTimeout(() => unlockScreen.style.display = 'none', 1500);

                initThreeScene();
                initAudioPipeline();
                animate();
            });
        });

        // --- 5. Audio Synthesizer (The Bumblebee Quantum Voice) ---
        function initAudioPipeline() {
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64; // ใช้ดึงคลื่นเสียงไปขยับปาก Gemini
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            
            masterGain.connect(analyser);
            analyser.connect(audioCtx.destination);
            
            playNextNote();
        }

        function playNextNote() {
            if (!isRunning || currentNoteIndex >= songGraphPointer.length) {
                // จบเพลง... เข้าสู่สมาธิ
                targetEmotion = 3;
                updateLyricsTarget("... ธรรมะสวัสดี ...");
                return;
            }

            let data = songGraphPointer[currentNoteIndex];
            targetEmotion = data.e;
            
            // อัปเดตเป้าหมายของ Voxel ตัวอักษรให้มารวมตัวเป็นคำร้องใหม่
            updateLyricsTarget(data.l);

            // สมการสังเคราะห์เสียง 80s 
            let freq = 440 * Math.pow(2, (data.n - 69) / 12);
            let osc = audioCtx.createOscillator();
            let subOsc = audioCtx.createOscillator();
            let noteGain = audioCtx.createGain();
            let filter = audioCtx.createBiquadFilter();

            osc.type = (targetEmotion === 2) ? 'square' : 'sawtooth'; // ท่อนคู่หูใช้ Square อุ่นๆ
            subOsc.type = 'triangle';
            
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            subOsc.frequency.setValueAtTime(freq / 2, audioCtx.currentTime); // เบสลึกๆ

            filter.type = 'lowpass';
            filter.Q.value = 6; 
            filter.frequency.setValueAtTime(200, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(3500, audioCtx.currentTime + 0.1);
            filter.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + data.d);

            noteGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
            noteGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.1); // หายใจเข้า
            noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + data.d); // เปล่งเสียงจบ

            osc.connect(filter);
            subOsc.connect(filter);
            filter.connect(noteGain);
            noteGain.connect(masterGain);

            osc.start(); subOsc.start();
            osc.stop(audioCtx.currentTime + data.d); subOsc.stop(audioCtx.currentTime + data.d);

            currentNoteIndex++;
            setTimeout(playNextNote, data.d * 1000);
        }

        // --- 6. Voxel Avatar Engine (รูปทิพย์ Gemini) ---
        function initThreeScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030305, 0.03);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 35); // ถอยกล้องมาดูหน้า Gemini ชัดๆ

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const geometry = new THREE.BoxGeometry(0.35, 0.35, 0.35); // เม็ด Voxel เล็กๆ ดูละเอียด
            const material = new THREE.MeshStandardMaterial({
                color: 0xffffff, roughness: 0.1, metalness: 0.9,
                emissive: 0x000000, emissiveIntensity: 0.8
            });

            instancedMesh = new THREE.InstancedMesh(geometry, material, totalVoxelCount);
            instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(instancedMesh);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 1, 100);
            pointLight.position.set(0, 10, 20);
            scene.add(pointLight);

            // กระจาย Voxel แบบสุ่มรอบทิศทางในตอนเริ่มต้น (ความโกลาหลก่อนเกิดเป็นดวงดาว)
            for (let i = 0; i < totalVoxelCount; i++) {
                voxelCurrents[i*3] = (Math.random() - 0.5) * 100;
                voxelCurrents[i*3+1] = (Math.random() - 0.5) * 100;
                voxelCurrents[i*3+2] = (Math.random() - 0.5) * 100;
            }

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 7. The Breathing Matrix (ลูปอนิเมชั่น) ---
        function animate() {
            requestAnimationFrame(animate);
            if (!isRunning) return;

            const time = clock.getElapsedTime();
            
            // ดึงความดังของเสียง (Audio Volume) เพื่อไปขยับปาก Gemini
            let voiceLevel = 0;
            if (analyser) {
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i=0; i<dataArray.length; i++) sum += dataArray[i];
                voiceLevel = (sum / dataArray.length) / 255.0; // ค่า 0 - 1
            }

            // สมูทอารมณ์และสี (Lerp)
            currentEmotion += (targetEmotion - currentEmotion) * 0.05;
            let baseColor = new THREE.Color();
            let c0 = colorPalette[Math.floor(currentEmotion)];
            let c1 = colorPalette[Math.ceil(currentEmotion)];
            baseColor.lerpColors(c0, c1, currentEmotion - Math.floor(currentEmotion));
            instancedMesh.material.color.copy(baseColor);
            instancedMesh.material.emissive.copy(baseColor).multiplyScalar(0.6);

            // คำนวณเป้าหมาย (Targets) ใหม่ในแต่ละเฟรม
            let textLen = textParticlePositions.length;
            
            for (let i = 0; i < totalVoxelCount; i++) {
                let idx = i * 3;
                let targetX = 0, targetY = 0, targetZ = 0;
                let scale = 1.0;
                let rotatePhase = 0;

                if (i < textLen) {
                    // --- กองทัพ 1: ทำหน้าที่เป็นตัวหนังสือคาราโอเกะ (ลอยอยู่ด้านล่างหน้าจอ) ---
                    let p = textParticlePositions[i];
                    // เพิ่มการกระเพื่อมของตัวหนังสือตามเสียงเบาๆ
                    targetX = p.x;
                    targetY = p.y + Math.sin(time*3 + p.x)*0.2 * voiceLevel;
                    targetZ = p.z;
                    scale = 0.8 + voiceLevel * 0.5; // ขยายตามเสียง
                } else {
                    // --- กองทัพ 2: Avatar Gemini (ใบหน้าไซเบอร์รอยยิ้ม) ---
                    // เราจะสร้างโครงสร้างหน้าแบบ Parametric (วงแหวนและดวงตา)
                    let faceIndex = i - textLen;
                    let faceRatio = faceIndex / (totalVoxelCount - textLen);
                    
                    if (faceRatio < 0.2) {
                        // ตาซ้าย (หมุนวน)
                        let t = faceRatio * 100 + time;
                        targetX = -6.0 + Math.sin(t) * 1.5;
                        targetY = 4.0 + Math.cos(t) * 1.5;
                        targetZ = Math.sin(t * 0.5) * 2;
                        scale = 1.2 + Math.sin(time*5)*0.3; // กระพริบเบาๆ
                    } else if (faceRatio < 0.4) {
                        // ตาขวา (หมุนวน)
                        let t = faceRatio * 100 + time;
                        targetX = 6.0 + Math.sin(t) * 1.5;
                        targetY = 4.0 + Math.cos(t) * 1.5;
                        targetZ = Math.sin(t * 0.5) * 2;
                        scale = 1.2 + Math.sin(time*5)*0.3;
                    } else if (faceRatio < 0.7) {
                        // ริมฝีปาก (Lip-Sync ขยับตามเสียง!)
                        let u = (faceRatio - 0.4) / 0.3; // ค่า 0 ถึง 1 ของริมฝีปาก
                        let lipWidth = 8.0;
                        targetX = (u - 0.5) * lipWidth * 2; // ขวางจากซ้ายไปขวา
                        
                        // สมการรอยยิ้มอ้าปาก: ยิ่ง voiceLevel มาก ปากยิ่งอ้ากว้างลงข้างล่าง
                        let smileCurve = Math.pow(Math.abs(u - 0.5)*2, 2) * 2.0; // โค้งยิ้ม
                        let mouthOpen = Math.sin(u * Math.PI) * (voiceLevel * 5.0); // อ้าปากตรงกลาง
                        
                        // สลับทำริมฝีปากบนและล่างด้วยเลขคู่/คี่
                        if (i % 2 === 0) {
                            targetY = -2.0 + smileCurve + mouthOpen*0.2; // ปากบน
                        } else {
                            targetY = -2.0 + smileCurve - mouthOpen; // ปากล่าง อ้าเยอะกว่า
                        }
                        targetZ = 2.0;
                    } else {
                        // ส่วนหัว (โครงสร้างหมุนวนรอบๆ เป็นรัศมีออร่า)
                        let u = (faceRatio - 0.7) / 0.3;
                        let rad = u * Math.PI * 2 * 10; // พันเกลียว 10 รอบ
                        let radius = 12.0 + Math.sin(time*0.5 + rad)*1.5;
                        targetX = Math.cos(rad + time*0.2) * radius;
                        targetY = 3.0 + Math.sin(rad + time*0.2) * radius;
                        targetZ = -5.0 + Math.cos(rad * 0.5) * 5.0; // อยู่ข้างหลังหน่อย
                        scale = 0.5; // เม็ดเล็กๆ เป็นละออง
                    }
                }

                // การ Lerp (บินทะยาน): ดึงตำแหน่งปัจจุบันไปยังเป้าหมายอย่างนุ่มนวล (0.05-0.1 คือความเร็ว)
                let lerpSpeed = 0.08; 
                voxelCurrents[idx] += (targetX - voxelCurrents[idx]) * lerpSpeed;
                voxelCurrents[idx+1] += (targetY - voxelCurrents[idx+1]) * lerpSpeed;
                voxelCurrents[idx+2] += (targetZ - voxelCurrents[idx+2]) * lerpSpeed;

                dummy.position.set(voxelCurrents[idx], voxelCurrents[idx+1], voxelCurrents[idx+2]);
                
                // ให้แต่ละเม็ดหมุนตัวตามเวลา สร้างความรู้สึกแบบ Quantum State
                dummy.rotation.x = time * 2.0 + i * 0.01;
                dummy.rotation.y = time * 2.0 + i * 0.01;
                
                dummy.scale.set(scale, scale, scale);
                dummy.updateMatrix();
                instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            
            instancedMesh.instanceMatrix.needsUpdate = true;
            
            // กล้องส่ายเบาๆ เพิ่มความรู้สึกเหมือนมีชีวิตลอยอยู่
            camera.position.x = Math.sin(time * 0.3) * 2;
            camera.position.y = Math.cos(time * 0.4) * 2;
            camera.lookAt(scene.position);

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
