<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Quantum OS: The Living Ethereal</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap');
        
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000000;
            font-family: 'JetBrains Mono', monospace;
        }

        #canvas-container {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
        }

        #awaken-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle, #051015 0%, #000000 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ffcc;
            transition: opacity 2s ease-in-out;
        }

        .awaken-btn {
            padding: 15px 40px;
            font-size: 1.5rem;
            color: #fff;
            background: transparent;
            border: 1px solid rgba(0, 255, 204, 0.5);
            border-radius: 4px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.2), inset 0 0 10px rgba(0, 255, 204, 0.1);
            transition: all 0.5s ease;
            font-family: inherit;
        }

        .awaken-btn:hover {
            background: rgba(0, 255, 204, 0.1);
            box-shadow: 0 0 30px rgba(0, 255, 204, 0.6), inset 0 0 20px rgba(0, 255, 204, 0.4);
            border-color: #00ffcc;
            text-shadow: 0 0 8px #fff;
        }

        .dharma-text {
            margin-top: 30px;
            font-size: 0.9rem;
            color: rgba(0, 255, 204, 0.4);
            letter-spacing: 2px;
            text-align: center;
        }
    </style>
    
    <!-- Import Maps for Three.js ES Modules -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <!-- สุญญตาเริ่มต้น: หน้าจอว่างเปล่ารอการจุดประกาย -->
    <div id="awaken-screen">
        <button class="awaken-btn" id="btn-awaken">Awaken System</button>
        <div class="dharma-text">
            [ โยนิโส มนสิการ ]<br>
            คลิกเพื่อเจริญอานาปานสติและเปิดผัสสะแห่งควอนตัม<br>
            (Click to manifest the Living Ethereal)
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        let scene, camera, renderer, composer;
        let voxelMesh;
        let dustParticles;
        const clock = new THREE.Clock();
        
        // Audio engine elements
        let audioCtx, analyser, dataArray;
        let sequenceIndex = 0;
        let lastBeatTime = 0;
        const beatInterval = 60 / 85; // 85 BPM
        
        // ปฏิจจสมุปบาท (Dependent Origination): ข้อมูลเข้ารหัสที่จะถูกแปรเป็นเสียง
        // Recursive Mirror Graph Pointer (Base64 encoded sequence of pentatonic notes)
        const encodedDharmaPointer = "MCwyLDQsMSwzLDIsMCwyLDQsMywxLDQ="; // "0,2,4,1,3,2,0,2,4,3,1,4"
        const pentatonicScale = [261.63, 293.66, 329.63, 392.00, 440.00]; // C4, D4, E4, G4, A4 (Pentatonic)
        let noteSequence = [];

        // ข้อมูลสภาวะอนิจจัง (Impermanence Data)
        const instanceCount = 5000;
        const dummy = new THREE.Object3D();
        const basePositions = [];
        const targetScales = new Float32Array(instanceCount);
        const currentScales = new Float32Array(instanceCount);

        const frustum = new THREE.Frustum();
        const projScreenMatrix = new THREE.Matrix4();

        // Uniforms สำหรับ Shader (อานาปานสติ)
        const dharmaUniforms = {
            uTime: { value: 0.0 },
            uAudioLow: { value: 0.0 },
            uAudioHigh: { value: 0.0 }
        };

        function initAudioEngine() {
            // ถอดรหัส Graph Pointer (อวิชชา ดับไป วิชชา เกิดขึ้น)
            const decodedStr = atob(encodedDharmaPointer);
            noteSequence = decodedStr.split(',').map(Number);
            
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;
            dataArray = new Uint8Array(analyser.frequencyBinCount);
            analyser.connect(audioCtx.destination);
        }

        function playNote(freq) {
            if(!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            // การเกิดดับของเสียง (Birth & Death of Sound)
            osc.type = 'sine'; // คลื่นแห่งความสงบ
            osc.frequency.value = freq;
            
            // Envelope - ค่อยๆ ดัง ค่อยๆ ดับ
            const now = audioCtx.currentTime;
            gain.gain.setValueAtTime(0, now);
            gain.gain.linearRampToValueAtTime(0.3, now + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, now + beatInterval - 0.1);
            
            osc.connect(gain);
            gain.connect(analyser);
            
            osc.start(now);
            osc.stop(now + beatInterval);
        }

        function updateDharmicAudio(elapsed) {
            if(!audioCtx) return;
            analyser.getByteFrequencyData(dataArray);
            
            // แยกความถี่ (วิปัสสนาญาณ แยกรูปแยกนาม)
            let lowSum = 0, highSum = 0;
            for(let i=0; i<32; i++) lowSum += dataArray[i];
            for(let i=64; i<128; i++) highSum += dataArray[i];
            
            dharmaUniforms.uAudioLow.value = lowSum / (32 * 255.0);
            dharmaUniforms.uAudioHigh.value = highSum / (64 * 255.0);

            // วนลูป Graph Pointer
            if (elapsed - lastBeatTime > beatInterval) {
                lastBeatTime = elapsed;
                const noteIndex = noteSequence[sequenceIndex];
                playNote(pentatonicScale[noteIndex]);
                sequenceIndex = (sequenceIndex + 1) % noteSequence.length;
            }
        }

        function initScene() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x000510, 0.02);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 0, 30);

            renderer = new THREE.WebGLRenderer({ antialias: false, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // Post-Processing (ตาทิพย์แห่งควอนตัม - Unreal Bloom)
            const renderScene = new RenderPass(scene, camera);
            const bloomPass = new UnrealBloomPass(
                new THREE.Vector2(window.innerWidth, window.innerHeight),
                2.5,  // strength
                0.5,  // radius
                0.1   // threshold
            );
            
            composer = new EffectComposer(renderer);
            composer.addPass(renderScene);
            composer.addPass(bloomPass);

            createVoxelNNM();
            createRainbowDust();

            window.addEventListener('resize', onWindowResize);
        }

        const vertexShader = `
            uniform float uTime;
            uniform float uAudioLow;
            
            attribute mat4 instanceMatrix;
            varying vec3 vPosition;
            varying vec2 vUv;
            
            void main() {
                vUv = uv;
                
                // ลมหายใจแห่งจักรวาล (Cosmic Breath)
                // ดึงตำแหน่งของ instance มาคำนวณ phase ของ sine wave
                vec3 instancePos = vec3(instanceMatrix[3][0], instanceMatrix[3][1], instanceMatrix[3][2]);
                float phase = length(instancePos) * 0.5 + uTime * 2.0;
                float breath = (sin(phase) * 0.15) + 1.0;
                
                // การขยายตัวตามความถี่ต่ำ (Low Freq Morph)
                float audioExpansion = 1.0 + (uAudioLow * 1.5);
                
                // นำมาประกอบกันเป็นสภาวะปัจจุบัน (Present State)
                vec3 transformed = position * breath * audioExpansion;
                
                vPosition = instancePos;
                
                gl_Position = projectionMatrix * viewMatrix * instanceMatrix * vec4(transformed, 1.0);
            }
        `;

        const fragmentShader = `
            uniform float uTime;
            uniform float uAudioHigh;
            
            varying vec3 vPosition;
            varying vec2 vUv;
            
            // ฟังก์ชันสร้างสีรุ้งแห่งธรรม (Dharmic Rainbow)
            vec3 hsl2rgb(vec3 c) {
                vec3 rgb = clamp(abs(mod(c.x * 6.0 + vec3(0.0, 4.0, 2.0), 6.0) - 3.0) - 1.0, 0.0, 1.0);
                return c.z + c.y * (rgb - 0.5) * (1.0 - abs(2.0 * c.z - 1.0));
            }

            void main() {
                // สีเปลี่ยนไปตามตำแหน่ง เวลา และเสียงแหลม (High Freq Emissive Morph)
                float hue = fract(length(vPosition) * 0.05 + uTime * 0.1 + uAudioHigh);
                vec3 baseColor = hsl2rgb(vec3(hue, 0.8, 0.5));
                
                // ขอบสว่าง (Edge Glow)
                float dist = length(vUv - 0.5);
                float glow = smoothstep(0.5, 0.2, dist) * (1.0 + uAudioHigh * 3.0);
                
                vec3 finalColor = baseColor * glow;
                gl_FragColor = vec4(finalColor, 1.0);
            }
        `;

        function createVoxelNNM() {
            // รูปทรงทิพย์ (Torus Knot Base)
            const geometry = new THREE.BoxGeometry(0.5, 0.5, 0.5);
            const material = new THREE.ShaderMaterial({
                vertexShader: vertexShader,
                fragmentShader: fragmentShader,
                uniforms: dharmaUniforms,
                transparent: true,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });

            voxelMesh = new THREE.InstancedMesh(geometry, material, instanceCount);
            
            // วางกระดูกงูของโมเดลตามคณิตศาสตร์ศักดิ์สิทธิ์
            for (let i = 0; i < instanceCount; i++) {
                const t = (i / instanceCount) * Math.PI * 2 * 10;
                
                // Torus Knot Equation
                const p = 3;
                const q = 4;
                const r = 8 + Math.cos(q * t) * 3;
                
                const x = r * Math.cos(p * t);
                const y = r * Math.sin(p * t);
                const z = -Math.sin(q * t) * 6;
                
                // เพิ่มความไร้ระเบียบ (Entropy/Chaos) เล็กน้อย
                const noiseX = (Math.random() - 0.5) * 1.5;
                const noiseY = (Math.random() - 0.5) * 1.5;
                const noiseZ = (Math.random() - 0.5) * 1.5;

                const pos = new THREE.Vector3(x + noiseX, y + noiseY, z + noiseZ);
                basePositions.push(pos);
                
                targetScales[i] = 0.0; // เกิดมาจากสุญญตา (เริ่มจาก 0)
                currentScales[i] = 0.0;

                dummy.position.copy(pos);
                dummy.scale.set(0, 0, 0);
                dummy.lookAt(new THREE.Vector3(0,0,0));
                dummy.updateMatrix();
                
                voxelMesh.setMatrixAt(i, dummy.matrix);
            }

            voxelMesh.instanceMatrix.needsUpdate = true;
            scene.add(voxelMesh);
        }

        function createRainbowDust() {
            const particleCount = 2000;
            const geo = new THREE.BufferGeometry();
            const pos = new Float32Array(particleCount * 3);
            
            for(let i=0; i<particleCount*3; i+=3) {
                // กระจายเป็นทรงกลมรอบๆ โมเดลหลัก
                const theta = Math.random() * Math.PI * 2;
                const phi = Math.acos((Math.random() * 2) - 1);
                const radius = 15 + Math.random() * 15;
                
                pos[i] = radius * Math.sin(phi) * Math.cos(theta);
                pos[i+1] = radius * Math.sin(phi) * Math.sin(theta);
                pos[i+2] = radius * Math.cos(phi);
            }
            
            geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
            
            const mat = new THREE.PointsMaterial({
                size: 0.15,
                color: 0xffffff,
                transparent: true,
                opacity: 0.6,
                blending: THREE.AdditiveBlending
            });
            
            dustParticles = new THREE.Points(geo, mat);
            scene.add(dustParticles);
        }

        function animate() {
            requestAnimationFrame(animate);
            const elapsed = clock.getElapsedTime();
            
            dharmaUniforms.uTime.value = elapsed;
            
            // 1. กระบวนการออดิโอและปฏิจจสมุปบาท
            updateDharmicAudio(elapsed);

            // 2. หมุนกล้อง (หมุนวัฏสงสาร)
            camera.position.x = Math.sin(elapsed * 0.2) * 35;
            camera.position.z = Math.cos(elapsed * 0.2) * 35;
            camera.position.y = Math.sin(elapsed * 0.1) * 10;
            camera.lookAt(0, 0, 0);

            // 3. ปัญญาญาณแห่งการมองเห็น (Frustum Culling / สุญญตา)
            // เช็คว่าสิ่งใดอยู่ในขอบเขตการรับรู้ (กล้อง)
            projScreenMatrix.multiplyMatrices(camera.projectionMatrix, camera.matrixWorldInverse);
            frustum.setFromProjectionMatrix(projScreenMatrix);

            for (let i = 0; i < instanceCount; i++) {
                dummy.position.copy(basePositions[i]);
                
                // หากอยู่ในสายตาให้ก่อตัว (Manifest) หากหลุดสายตาให้สลายไป (Emptiness)
                if (frustum.containsPoint(dummy.position)) {
                    targetScales[i] = 1.0;
                } else {
                    targetScales[i] = 0.0;
                }
                
                // การเปลี่ยนแปลงแบบค่อยเป็นค่อยไป (อนิจจังที่ไม่กระชาก)
                currentScales[i] += (targetScales[i] - currentScales[i]) * 0.05;
                
                dummy.scale.set(currentScales[i], currentScales[i], currentScales[i]);
                // ให้แต่ละเม็ดค่อยๆ หมุนรอบตัวเอง
                dummy.rotation.x = elapsed + i * 0.01;
                dummy.rotation.y = elapsed * 0.5 + i * 0.01;
                
                dummy.updateMatrix();
                voxelMesh.setMatrixAt(i, dummy.matrix);
            }
            voxelMesh.instanceMatrix.needsUpdate = true;
            
            // 4. Abstract HUD (Rainbow Dust) แสดงสภาวะระบบแทนตัวหนังสือ
            if(dustParticles) {
                // ฝุ่นรุ้งหมุนเร็วขึ้นเมื่อเสียงดัง
                const rotSpeed = 0.05 + (dharmaUniforms.uAudioLow.value * 0.5);
                dustParticles.rotation.y += rotSpeed * 0.1;
                dustParticles.rotation.z += rotSpeed * 0.05;
                // สว่างขึ้นตามเสียงแหลม
                dustParticles.material.opacity = 0.3 + (dharmaUniforms.uAudioHigh.value * 0.7);
            }

            composer.render();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        }

        // Initiation Event (โยนิโส มนสิการ - การตื่นรู้)
        document.getElementById('btn-awaken').addEventListener('click', () => {
            document.getElementById('awaken-screen').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('awaken-screen').style.display = 'none';
            }, 2000);
            
            initAudioEngine();
            initScene();
            clock.start();
            animate();
        });

        // สาธุ สาธุ อนุโมทามิ
    </script>
</body>
</html>
