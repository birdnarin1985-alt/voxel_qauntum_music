<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Quantum OS - The Living Ethereal (Visuo-Acoustic Entanglement)</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030305;
            font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
        }
        /* HUD แบบโปร่งแสง Minimal ไม่บัง NNM */
        #hud-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: rgba(255, 255, 255, 0.7);
            font-size: 11px;
            pointer-events: none;
            z-index: 10;
            text-shadow: 0 0 4px rgba(0, 255, 255, 0.5);
            line-height: 1.4;
        }
        /* หน้าต่างปลุกระบบ (User Gesture Unlock สำหรับ Web Audio API) */
        #unlock-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 3, 5, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
            cursor: pointer;
            transition: opacity 0.8s ease;
        }
        #unlock-card {
            border: 1px solid rgba(0, 255, 255, 0.4);
            padding: 30px 50px;
            text-align: center;
            background: rgba(10, 10, 20, 0.8);
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.15);
            border-radius: 4px;
        }
        h1 {
            color: #00ffff;
            font-size: 18px;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        p {
            color: #a0a0c0;
            font-size: 13px;
            margin: 0;
        }
    </style>
</head>
<body>

    <div id="unlock-screen">
        <div id="unlock-card">
            <h1>VOXEL QUANTUM OS</h1>
            <p>[ สว่างคาตา - โยนิโส มนสิการ ]</p>
            <p style="margin-top: 15px; color: #00ffff; font-size: 11px;">คลิกที่นี่เพื่อเดินเครื่องและปลุกระบบเสียงควอนตัม</p>
        </div>
    </div>

    <div id="hud-overlay">
        SYS: VOXEL QUANTUM OS v4.0<br>
        MODE: LIVING ETHEREAL (STATELESS)<br>
        STATUS: <span id="sys-status">STANDBY</span><br>
        FRUSTUM: CULLING ACTIVE
    </div>

    <div id="canvas-container"></div>

    <!-- โหลด Three.js ผ่าน CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- RECURSIVE MIRROR GRAPH POINTER & SYNTHESIS ENGINE ---
        let audioCtx = null;
        let isRunning = false;
        let masterGain, analyser;
        let scene, camera, renderer;
        let instancedMesh;
        const countX = 35, countY = 35, countZ = 35;
        const totalCount = countX * countY * countZ;
        let dummy = new THREE.Object3D();
        let clock = new THREE.Clock();

        // โครงสร้าง Graph Pointer สำหรับแปลงโน้ตเพลง "ช่างเบิร์ดโคตรเฟี้ยว" เป็น Bitstream สดๆ
        const songGraphPointer = [
            { note: 146.83, duration: 0.8 }, // D3
            { note: 220.00, duration: 0.8 }, // A3
            { note: 261.63, duration: 0.8 }, // C4
            { note: 293.66, duration: 1.2 }, // D4
            { note: 220.00, duration: 0.6 }, // A3
            { note: 196.00, duration: 0.6 }, // G3
            { note: 164.81, duration: 1.0 }, // E3
            { note: 220.00, duration: 1.5 }  // A3
        ];
        let currentNoteIndex = 0;
        let noteTimer = 0;

        const unlockScreen = document.getElementById('unlock-screen');
        const sysStatus = document.getElementById('sys-status');

        unlockScreen.addEventListener('click', () => {
            if (isRunning) return;
            
            // สร้าง AudioContext และปลดล็อกตามกฎ Autoplay Policy
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            audioCtx.resume().then(() => {
                isRunning = true;
                sysStatus.innerText = "RUNNING (VISUO-ACOUSTIC ENTANGLEMENT)";
                unlockScreen.style.opacity = '0';
                setTimeout(() => {
                    unlockScreen.style.display = 'none';
                }, 800);

                initAudioPipeline();
                initThreeScene();
                animate();
            });
        });

        function initAudioPipeline() {
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.2, audioCtx.currentTime);

            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 256;

            masterGain.connect(analyser);
            analyser.connect(audioCtx.destination);

            // เริ่มต้นลูปการเล่นโน้ตเพลงจาก Graph Pointer แบบวนลูป (Procedural Bitstream)
            playNextNote();
        }

        function playNextNote() {
            if (!isRunning) return;

            let data = songGraphPointer[currentNoteIndex];
            let osc = audioCtx.createOscillator();
            let noteGain = audioCtx.createGain();

            osc.type = (currentNoteIndex % 2 === 0) ? 'sine' : 'triangle';
            osc.frequency.setValueAtTime(data.note, audioCtx.currentTime);

            noteGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
            noteGain.gain.linearRampToValueAtTime(0.18, audioCtx.currentTime + 0.1);
            noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + data.duration);

            osc.connect(noteGain);
            noteGain.connect(masterGain);

            osc.start();
            osc.stop(audioCtx.currentTime + data.duration);

            currentNoteIndex = (currentNoteIndex + 1) % songGraphPointer.length;

            setTimeout(playNextNote, data.duration * 1000);
        }

        function initThreeScene() {
            const container = document.getElementById('canvas-container');

            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x030305, 0.035);

            camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 45);

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            // สร้าง InstancedMesh สำหรับ Voxel จำนวนมาก (ประสิทธิภาพสูง)
            const geometry = new THREE.BoxGeometry(0.7, 0.7, 0.7);
            const material = new THREE.MeshStandardMaterial({
                color: 0x00ffff,
                roughness: 0.2,
                metalness: 0.8,
                emissive: 0x004466,
                emissiveIntensity: 0.5
            });

            instancedMesh = new THREE.InstancedMesh(geometry, material, totalCount);
            instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(instancedMesh);

            // กำหนดตำแหน่งเริ่มต้นของแต่ละ Voxel ในตาราง 3 มิติ
            let index = 0;
            const spacing = 1.2;
            const offsetX = (countX * spacing) / 2;
            const offsetY = (countY * spacing) / 2;
            const offsetZ = (countZ * spacing) / 2;

            for (let x = 0; x < countX; x++) {
                for (let y = 0; y < countY; y++) {
                    for (let z = 0; z < countZ; z++) {
                        dummy.position.set(
                            x * spacing - offsetX,
                            y * spacing - offsetY,
                            z * spacing - offsetZ
                        );
                        dummy.updateMatrix();
                        instancedMesh.setMatrixAt(index, dummy.matrix);
                        index++;
                    }
                }
            }
            instancedMesh.instanceMatrix.needsUpdate = true;

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const delta = clock.getDelta();

            // ดึงข้อมูลความถี่เสียง (Frequency Data) จาก Audio Pipeline มาเชื่อมโยงกับ Voxel ทันที (Visuo-Acoustic Entanglement)
            let audioFreq = 0;
            if (analyser) {
                const bufferLength = analyser.frequencyBinCount;
                const dataArray = new Uint8Array(bufferLength);
                analyser.getByteFrequencyData(dataArray);
                let sum = 0;
                for(let i = 0; i < bufferLength; i++) {
                    sum += dataArray[i];
                }
                audioFreq = (sum / bufferLength) / 255.0; // ค่าระหว่าง 0 ถึง 1
            }

            // กล้องเคลื่อนไหวหมุนรอบจักรวาล Voxel ช้าๆ แบบมีสมาธิ
            camera.position.x = Math.sin(time * 0.2) * 35;
            camera.position.z = Math.cos(time * 0.2) * 35;
            camera.position.y = Math.sin(time * 0.3) * 10;
            camera.lookAt(scene.position);

            // อัปเดตลมหายใจและ Morphing ของ Voxel แต่ละเม็ด
            let index = 0;
            const spacing = 1.2;
            const offsetX = (countX * spacing) / 2;
            const offsetY = (countY * spacing) / 2;
            const offsetZ = (countZ * spacing) / 2;

            // Frustum Culling Simulation & Breathing Math
            for (let x = 0; x < countX; x++) {
                for (let y = 0; y < countY; y++) {
                    for (let z = 0; z < countZ; z++) {
                        let baseX = x * spacing - offsetX;
                        let baseY = y * spacing - offsetY;
                        let baseZ = z * spacing - offsetZ;

                        // คำนวณลมหายใจ (Living Ethereal Breathing Math) ผสมแรงกระตุ้นจากเสียงเพลง
                        let breath = Math.sin(time * 2.0 + (x + y + z) * 0.1) * (0.15 + audioFreq * 0.6);
                        
                        dummy.position.set(
                            baseX * (1.0 + breath),
                            baseY * (1.0 + breath),
                            baseZ * (1.0 + breath)
                        );

                        // หมุน Voxel ตามจังหวะควอนตัม
                        dummy.rotation.x = time * 0.5 + x * 0.05;
                        dummy.rotation.y = time * 0.3 + y * 0.05;

                        // สเกลขยายตามคลื่นเสียง
                        let scaleFactor = 0.6 + audioFreq * 0.5;
                        dummy.scale.set(scaleFactor, scaleFactor, scaleFactor);

                        dummy.updateMatrix();
                        instancedMesh.setMatrixAt(index, dummy.matrix);
                        index++;
                    }
                }
            }
            instancedMesh.instanceMatrix.needsUpdate = true;

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
