<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voxel Quantum OS - Gemini Emoji & Absolute Layering</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: #010102; font-family: 'Courier New', Courier, monospace;
        }
        #canvas-container { width: 100%; height: 100%; position: absolute; top: 0; left: 0; }
        
        /* ซ่อน Canvas ลับสำหรับสแกนสีและหาจุดศูนย์ถ่วง (Center of Mass) */
        #hidden-canvas { display: none; }
        
        #unlock-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(1, 1, 2, 0.95); display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; cursor: pointer;
            transition: opacity 0.8s ease;
        }
        #unlock-card {
            border: 2px solid #00ffcc; padding: 40px 60px; text-align: center;
            background: rgba(10, 15, 20, 0.9); box-shadow: 0 0 50px rgba(0, 255, 204, 0.2);
            border-radius: 12px;
        }
        h1 { color: #00ffcc; font-size: 22px; margin-bottom: 15px; letter-spacing: 2px; text-shadow: 0 0 15px #00ffcc; }
        p { color: #b0c0d0; font-size: 13px; margin: 8px 0; }
    </style>
</head>
<body>

    <canvas id="hidden-canvas" width="800" height="400"></canvas>

    <div id="unlock-screen">
        <div id="unlock-card">
            <h1>VOXEL QUANTUM OS</h1>
            <p style="color: #ffaa00; font-weight: bold;">[ ABSOLUTE CENTERING & LAYER SORTING ]</p>
            <p>อวตาร Gemini กลางจอ ไร้ฝุ่นบังตา พร้อมเนื้อเพลงคลื่นมังกร</p>
            <p style="margin-top: 30px; color: #00ffcc; font-size: 12px; font-weight: bold;">[ คลิกเพื่อเดินเครื่องจัดระเบียบจักรวาล ]</p>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script>
        // --- 1. สถาปัตยกรรมระดับรากฐาน ---
        let audioCtx, masterGain, analyser;
        let isRunning = false;
        let scene, camera, renderer;
        
        const totalVoxelCount = 15000;
        let instancedMesh;
        let dummy = new THREE.Object3D();
        let clock = new THREE.Clock();

        // --- 2. ฟิสิกส์วิญญาณ: สปริงดราก้อนบอล (Snappy Physics) ---
        let currentPos = new Float32Array(totalVoxelCount * 3);
        let targetPos = new Float32Array(totalVoxelCount * 3);
        let velocity = new Float32Array(totalVoxelCount * 3);
        let isTextVoxel = new Uint8Array(totalVoxelCount); 
        let baseTextPos = new Float32Array(totalVoxelCount * 3); // เก็บตำแหน่งตั้งต้นของคลื่นตัวอักษร
        let colors = new Float32Array(totalVoxelCount * 3);

        const springStiffness = 0.15; // เด้งแรงขึ้น
        const springDamping = 0.65;   // หยุดเร็วขึ้น (Snappy)

        // --- 3. โครงสร้าง Graph Pointer (เนื้อเพลง + Emoji + โน้ตเพลง) ---
        const songGraphPointer = [
            { n: 62, d: 2.0, l: "สว่างคาตา...", emoji: "🥵" },
            { n: 64, d: 2.0, l: "มาหลายวันหลายคืน", emoji: "😵‍💫" },
            { n: 67, d: 2.5, l: "Voxel Quantum OS", emoji: "✨" },
            { n: 69, d: 2.5, l: "สมบูรณ์แล้ว!", emoji: "😎" },
            { n: 71, d: 2.0, l: "สายโซ่อุปทาน", emoji: "⚙️" },
            { n: 69, d: 2.5, l: "เครื่องยนต์พร้อมก้าว", emoji: "🚀" },
            { n: 67, d: 3.0, l: "แต่ข้าพเจ้า... ขอพักยาวๆ", emoji: "😮‍💨" },
            { n: 74, d: 2.5, l: "ช่างเบิร์ด...", emoji: "💖" },
            { n: 76, d: 3.0, l: "โคตรเฟี้ยว!!", emoji: "🔥" },
            { n: 74, d: 3.0, l: "เลี้ยวสู่ทางธรรม...", emoji: "😇" },
            { n: 72, d: 3.5, l: "กลับไปเลี้ยงเป็ดไก่", emoji: "🌱" },
            { n: 69, d: 4.0, l: "คู่หู Gemini... ขอบคุณ!", emoji: "🤖" },
            { n: 67, d: 4.0, l: "โยนิโส มนสิการ", emoji: "🧘" },
            { n: 64, d: 5.0, l: "สาธุ สัมปะติฉามิ...", emoji: "🙏" }
        ];
        let currentNoteIndex = 0;

        // --- 4. ฟังก์ชันค้นหาจุดศูนย์ถ่วง (Absolute Centering Math) ---
        const hCanvas = document.getElementById('hidden-canvas');
        const hCtx = hCanvas.getContext('2d', { willReadFrequently: true });

        function updateVoxelTargets(text, emoji) {
            let activeVoxelCount = 0;
            let tempColor = new THREE.Color();

            // ==========================================
            // [A] เลเยอร์ที่ 2: อวตาร Emoji (Z = 0) มัชฌิมา
            // ==========================================
            hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);
            hCtx.font = "140px sans-serif";
            hCtx.textAlign = 'center'; hCtx.textBaseline = 'middle';
            hCtx.fillText(emoji, hCanvas.width / 2, hCanvas.height / 2);

            let imgData = hCtx.getImageData(0, 0, hCanvas.width, hCanvas.height).data;
            const stepE = 4;
            
            // สแกนหา Min/Max เพื่อหา Center of Mass
            let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
            let emojiPixels = [];

            for (let y = 0; y < hCanvas.height; y += stepE) {
                for (let x = 0; x < hCanvas.width; x += stepE) {
                    const idx = (y * hCanvas.width + x) * 4;
                    if (imgData[idx + 3] > 100) {
                        emojiPixels.push({x: x, y: y, r: imgData[idx]/255, g: imgData[idx+1]/255, b: imgData[idx+2]/255});
                        if (x < minX) minX = x; if (x > maxX) maxX = x;
                        if (y < minY) minY = y; if (y > maxY) maxY = y;
                    }
                }
            }

            let centerX = (minX + maxX) / 2;
            let centerY = (minY + maxY) / 2;

            // นำพิกเซลไปจัดเรียงตรงกลางหน้าจอเป๊ะๆ (Absolute Center)
            emojiPixels.forEach(p => {
                const posX = (p.x - centerX) * 0.15;
                const posY = -(p.y - centerY) * 0.15 + 5.0; // เลื่อนขึ้นไปด้านบนนิดหน่อย
                
                // ซ้อน Voxel ให้มีความหนา
                for(let depth = -1; depth <= 1; depth++) {
                    if (activeVoxelCount >= totalVoxelCount) return;
                    let vIdx = activeVoxelCount * 3;
                    targetPos[vIdx] = posX;
                    targetPos[vIdx+1] = posY;
                    targetPos[vIdx+2] = depth * 0.5; // Z = 0 (Center Layer)
                    
                    colors[vIdx] = p.r; colors[vIdx+1] = p.g; colors[vIdx+2] = p.b;
                    isTextVoxel[activeVoxelCount] = 0;
                    activeVoxelCount++;
                }
            });

            // ==========================================
            // [B] เลเยอร์ที่ 1: คลื่นเนื้อเพลง (Z = +12) หน้าสุด
            // ==========================================
            hCtx.clearRect(0, 0, hCanvas.width, hCanvas.height);
            hCtx.font = "bold 55px 'Courier New', sans-serif";
            hCtx.fillText(text, hCanvas.width / 2, hCanvas.height / 2);

            imgData = hCtx.getImageData(0, 0, hCanvas.width, hCanvas.height).data;
            const stepT = 3;
            
            minX = Infinity; maxX = -Infinity; minY = Infinity; maxY = -Infinity;
            let textPixels = [];

            for (let y = 0; y < hCanvas.height; y += stepT) {
                for (let x = 0; x < hCanvas.width; x += stepT) {
                    const idx = (y * hCanvas.width + x) * 4;
                    if (imgData[idx + 3] > 100) {
                        textPixels.push({x: x, y: y});
                        if (x < minX) minX = x; if (x > maxX) maxX = x;
                        if (y < minY) minY = y; if (y > maxY) maxY = y;
                    }
                }
            }

            let textCenterX = (minX + maxX) / 2;
            let textCenterY = (minY + maxY) / 2;

            textPixels.forEach(p => {
                if (activeVoxelCount >= totalVoxelCount) return;
                const posX = (p.x - textCenterX) * 0.12;
                const posY = -(p.y - textCenterY) * 0.12 - 7.0; // ให้อยู่ด้านล่าง

                let vIdx = activeVoxelCount * 3;
                targetPos[vIdx] = posX;
                targetPos[vIdx+1] = posY;
                targetPos[vIdx+2] = 12.0; // Z = +12 (เด่นสุด ไม่โดนบังแน่นอน)
                
                // เก็บค่าเริ่มต้นไว้ทำคลื่นมังกร
                baseTextPos[vIdx] = posX;
                baseTextPos[vIdx+1] = posY;
                baseTextPos[vIdx+2] = 12.0;
                
                tempColor.setHSL((posX + 20) / 40, 0.9, 0.6); // สีรุ้ง Holographic
                colors[vIdx] = tempColor.r; colors[vIdx+1] = tempColor.g; colors[vIdx+2] = tempColor.b;
                
                isTextVoxel[activeVoxelCount] = 1; 
                activeVoxelCount++;
            });

            // ==========================================
            // [C] เลเยอร์ที่ 3: จักรวาลพื้นหลัง (Z = -30 ถึง -60) หลังสุด
            // ==========================================
            while (activeVoxelCount < totalVoxelCount) {
                let vIdx = activeVoxelCount * 3;
                
                // กระจายไปข้างหลังทั้งหมด ห้ามหลุดมาข้างหน้าเด็ดขาด
                targetPos[vIdx] = (Math.random() - 0.5) * 100; // X
                targetPos[vIdx+1] = (Math.random() - 0.5) * 80; // Y
                targetPos[vIdx+2] = -30 - Math.random() * 30;   // Z (ลึกเข้าไปในจอเท่านั้น)
                
                colors[vIdx] = 0.05; colors[vIdx+1] = 0.1; colors[vIdx+2] = 0.2; // ฝุ่นดาวสีมืดๆ
                isTextVoxel[activeVoxelCount] = 0;
                activeVoxelCount++;
            }

            instancedMesh.geometry.setAttribute('color', new THREE.InstancedBufferAttribute(colors, 3));
        }

        // --- 5. ปลุกระบบ ---
        const unlockScreen = document.getElementById('unlock-screen');
        unlockScreen.addEventListener('click', () => {
            if (isRunning) return;
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            audioCtx = new AudioContext();
            audioCtx.resume().then(() => {
                isRunning = true;
                unlockScreen.style.opacity = '0';
                setTimeout(() => unlockScreen.style.display = 'none', 1000);

                initThreeScene();
                initAudioPipeline();
                animate();
            });
        });

        // --- 6. Bumblebee Voice (80s Synth) ---
        function initAudioPipeline() {
            masterGain = audioCtx.createGain();
            masterGain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            analyser = audioCtx.createAnalyser();
            analyser.fftSize = 64; 
            masterGain.connect(analyser);
            analyser.connect(audioCtx.destination);
            playNextNote();
        }

        function playNextNote() {
            if (!isRunning || currentNoteIndex >= songGraphPointer.length) {
                updateVoxelTargets("สว่างคาตาแห่งมิตรภาพ", "✨");
                return;
            }

            let data = songGraphPointer[currentNoteIndex];
            updateVoxelTargets(data.l, data.emoji);

            let freq = 440 * Math.pow(2, (data.n - 69) / 12);
            let osc = audioCtx.createOscillator();
            let subOsc = audioCtx.createOscillator();
            let noteGain = audioCtx.createGain();
            let filter = audioCtx.createBiquadFilter();

            osc.type = 'sawtooth';
            subOsc.type = 'square';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            subOsc.frequency.setValueAtTime(freq / 2, audioCtx.currentTime); 

            filter.type = 'lowpass';
            filter.Q.value = 5; 
            filter.frequency.setValueAtTime(100, audioCtx.currentTime);
            filter.frequency.exponentialRampToValueAtTime(3500, audioCtx.currentTime + 0.1);
            filter.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + data.d);

            noteGain.gain.setValueAtTime(0.0, audioCtx.currentTime);
            noteGain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.05); 
            noteGain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + data.d); 

            osc.connect(filter); subOsc.connect(filter); filter.connect(noteGain); noteGain.connect(masterGain);
            osc.start(); subOsc.start();
            osc.stop(audioCtx.currentTime + data.d); subOsc.stop(audioCtx.currentTime + data.d);

            currentNoteIndex++;
            setTimeout(playNextNote, data.d * 1000);
        }

        // --- 7. Voxel Quantum Engine ---
        function initThreeScene() {
            const container = document.getElementById('canvas-container');
            scene = new THREE.Scene();
            scene.fog = new THREE.FogExp2(0x010102, 0.015);

            camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 0, 45); 

            renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            container.appendChild(renderer.domElement);

            const geometry = new THREE.BoxGeometry(0.4, 0.4, 0.4); 
            const material = new THREE.MeshStandardMaterial({
                vertexColors: true, roughness: 0.1, metalness: 0.8,
                emissive: 0xffffff, emissiveIntensity: 0.15 
            });

            instancedMesh = new THREE.InstancedMesh(geometry, material, totalVoxelCount);
            instancedMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
            scene.add(instancedMesh);

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6); scene.add(ambientLight);
            const pointLight = new THREE.PointLight(0xffffff, 1.2, 100); pointLight.position.set(10, 20, 20); scene.add(pointLight);
            const pointLight2 = new THREE.PointLight(0x00ffff, 0.8, 100); pointLight2.position.set(-10, -10, 20); scene.add(pointLight2);

            // กระจายเริ่มต้น (โกลาหล)
            for (let i = 0; i < totalVoxelCount * 3; i++) {
                currentPos[i] = (Math.random() - 0.5) * 100;
                targetPos[i] = currentPos[i];
            }

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- 8. The Dragon Ball Physics Loop ---
        function animate() {
            requestAnimationFrame(animate);
            if (!isRunning) return;

            const time = clock.getElapsedTime();
            
            let audioForce = 0;
            if (analyser) {
                let dataArr = new Uint8Array(analyser.frequencyBinCount);
                analyser.getByteFrequencyData(dataArr);
                let sum = 0; for(let i=0; i<8; i++) sum += dataArr[i];
                audioForce = (sum / 8) / 255.0;
            }

            for (let i = 0; i < totalVoxelCount; i++) {
                let idx = i * 3;
                let tx = targetPos[idx]; let ty = targetPos[idx+1]; let tz = targetPos[idx+2];

                // คลื่นมังกร (Wavy Ribbon) สำหรับตัวหนังสือ
                if (isTextVoxel[i] === 1) {
                    let bx = baseTextPos[idx];
                    let by = baseTextPos[idx+1];
                    let bz = baseTextPos[idx+2];
                    
                    // เลื้อยขึ้นลง (แกน Y) และ ดันเข้าออก (แกน Z) แบบเกลียวคลื่น
                    ty = by + Math.sin(time * 3.0 + bx * 0.4) * (1.2 + audioForce * 0.5);
                    tz = bz + Math.cos(time * 3.0 + bx * 0.4) * 1.5;
                } else if (tz < -10) {
                    // ฝุ่นดาวข้างหลัง หมุนช้าๆ สงบๆ
                    tx += Math.sin(time*0.5 + i)*0.5;
                    ty += Math.cos(time*0.5 + i)*0.5;
                } else {
                    // หน้า Emoji (Z=0) เด้งกระเพื่อมเบาๆ ตามบีทเสียง
                    tx += (Math.random()-0.5) * audioForce * 0.4;
                    ty += (Math.random()-0.5) * audioForce * 0.4;
                }

                // สปริงดีดตัว
                let forceX = (tx - currentPos[idx]) * springStiffness;
                let forceY = (ty - currentPos[idx+1]) * springStiffness;
                let forceZ = (tz - currentPos[idx+2]) * springStiffness;

                velocity[idx] = (velocity[idx] + forceX) * springDamping;
                velocity[idx+1] = (velocity[idx+1] + forceY) * springDamping;
                velocity[idx+2] = (velocity[idx+2] + forceZ) * springDamping;

                currentPos[idx] += velocity[idx]; currentPos[idx+1] += velocity[idx+1]; currentPos[idx+2] += velocity[idx+2];
                dummy.position.set(currentPos[idx], currentPos[idx+1], currentPos[idx+2]);
                
                let speed = Math.abs(velocity[idx]) + Math.abs(velocity[idx+1]);
                dummy.rotation.x += speed * 0.15; dummy.rotation.y += speed * 0.15;
                
                let s = 1.0 + (isTextVoxel[i] === 0 && tz > -10 ? audioForce * 0.3 : 0);
                dummy.scale.set(s, s, s);
                dummy.updateMatrix(); instancedMesh.setMatrixAt(i, dummy.matrix);
            }
            
            instancedMesh.instanceMatrix.needsUpdate = true;
            
            // กล้องส่ายเบาๆ เพื่อให้เห็นมิติ Z ชัดๆ
            camera.position.x = Math.sin(time * 0.3) * 2;
            camera.position.y = Math.cos(time * 0.2) * 1.5;
            camera.lookAt(scene.position);
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
